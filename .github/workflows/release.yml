name: Release

# Scaffold: the publish step activates once the npm @dusrel scope is owned and
# an NPM_TOKEN secret exists (docs/RELEASE.md). Until then this verifies that
# the release tooling itself runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Changesets status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Changesets status (informational until first publish)
        run: pnpm exec changeset status || true
