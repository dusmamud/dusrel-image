name: Release

# Changesets flow (docs/RELEASE.md): on every push to main this
# either maintains the "Version Packages" PR (while changesets
# exist) or, once that PR is merged, publishes the bumped
# packages to npm. Publishing authenticates with the NPM_TOKEN
# secret (a granular token scoped to the dusrel org) for the
# first release — npm cannot create a package via OIDC trusted
# publishing, so the token bootstraps the packages into
# existence; provenance attestations are attached via OIDC
# (id-token: write + NPM_CONFIG_PROVENANCE).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
