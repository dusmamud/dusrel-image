name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs-site/**'
      - 'packages/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required docs exist
        run: |
          for f in docs/PRD.md docs/TRD.md docs/ARCHITECTURE.md docs/API_DESIGN.md docs/RELEASE.md; do
            test -f "$f" && echo "ok: $f" || (echo "missing: $f" && exit 1)
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the docs site (TypeDoc API reference + VitePress)
        run: pnpm --filter @dusrel/docs-site build
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs-site/.vitepress/dist
          retention-days: 14
