name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs-site/**'
      - 'apps/playground/**'
      - 'packages/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required docs exist
        run: |
          for f in docs/PRD.md docs/TRD.md docs/ARCHITECTURE.md docs/API_DESIGN.md docs/RELEASE.md; do
            test -f "$f" && echo "ok: $f" || (echo "missing: $f" && exit 1)
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build the docs site (TypeDoc API reference + VitePress + playground)
        run: pnpm --filter @dusrel/docs-site build
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs-site/.vitepress/dist
          retention-days: 14
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
