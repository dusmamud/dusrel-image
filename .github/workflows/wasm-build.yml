name: WASM build

# Real codec builds happen here, inside pinned Docker images
# (docs/WASM_BUILD.md). Artifacts are uploaded for review; verified
# artifacts are committed into the codec packages and then exercised by
# the browser-tests workflow before they can be released.
on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/wasm-build.yml"

permissions:
  contents: read

jobs:
  mozjpeg:
    name: Build MozJPEG WASM (@dusrel/image-jpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
        run: docker build -t dusrel/mozjpeg native/mozjpeg
      - name: Run the build and collect artifacts
        run: |
          mkdir -p wasm-out/mozjpeg
          docker run --rm -v "$PWD/wasm-out/mozjpeg:/out" dusrel/mozjpeg
          ls -la wasm-out/mozjpeg
      - name: Upload MozJPEG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mozjpeg-wasm
          path: wasm-out/mozjpeg
          if-no-files-found: error

  webp:
    name: Build libwebp WASM (@dusrel/image-webp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
