name: WASM build

# Real codec builds happen here, inside pinned Docker images
# (docs/WASM_BUILD.md). Artifacts are uploaded for review; verified
# artifacts are committed into the codec packages and then exercised by
# the browser-tests workflow before they can be released.
on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/wasm-build.yml"

permissions:
  contents: read

jobs:
  mozjpeg:
    name: Build MozJPEG WASM (@dusrel/image-jpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
        run: docker build -t dusrel/mozjpeg native/mozjpeg
      - name: Run the build and collect artifacts
        run: |
          mkdir -p wasm-out/mozjpeg
          docker run --rm -v "$PWD/wasm-out/mozjpeg:/out" dusrel/mozjpeg
          ls -la wasm-out/mozjpeg
      - name: Upload MozJPEG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mozjpeg-wasm
          path: wasm-out/mozjpeg
          if-no-files-found: error

  webp:
    name: Build libwebp WASM (@dusrel/image-webp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
        run: docker build -t dusrel/webp native/webp
      - name: Run the build and collect artifacts
        run: |
          mkdir -p wasm-out/webp
          docker run --rm -v "$PWD/wasm-out/webp:/out" dusrel/webp
          ls -la wasm-out/webp
      - name: Upload libwebp artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webp-wasm
          path: wasm-out/webp
          if-no-files-found: error

  avif:
    name: Build libavif WASM (@dusrel/image-avif)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
        run: docker build -t dusrel/avif native/avif
      - name: Run the build and collect artifacts
        run: |
          mkdir -p wasm-out/avif
          docker run --rm -v "$PWD/wasm-out/avif:/out" dusrel/avif
          ls -la wasm-out/avif
      - name: Upload libavif artifacts
        uses: actions/upload-artifact@v7
        with:
          name: avif-wasm
          path: wasm-out/avif
          if-no-files-found: error

  rust-png:
    name: Build Rust PNG WASM (@dusrel/image-png)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Docker image
        run: docker build --build-arg CODEC=png -t dusrel/rust-png native/rust
      - name: Run the build and collect artifacts
        run: |
          mkdir -p wasm-out/png
          docker run --rm -v "$PWD/wasm-out/png:/out" dusrel/rust-png
          ls -la wasm-out/png
      - name: Upload PNG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: png-wasm
          path: wasm-out/png
          if-no-files-found: error
