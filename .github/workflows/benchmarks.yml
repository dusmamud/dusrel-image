name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  bench:
    name: Bundle budgets + codec benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record current bundle sizes
        run: pnpm size | tee benchmark-sizes.txt
      - name: Run codec benchmarks (benchmarks/run.mjs)
        run: node benchmarks/run.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-sizes.txt
            benchmarks/results.md
