[package]
name = "dusrel-oxipng"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dusrel glue around the oxipng crate for @dusrel/image-oxipng."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact pins, same discipline as the C codecs' Dockerfiles.
# default-features = false is deliberate: oxipng's defaults pull in
# the CLI binary deps, rayon parallelism and zopfli. The library
# build is single-threaded (the family default, ADR-0006) and uses
# the libdeflater DEFLATE engine.
wasm-bindgen = "=0.2.130"
oxipng = { version = "=10.2.1", default-features = false }
